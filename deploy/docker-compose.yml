# Chạy trên VPS trong thư mục /opt/umoja (cùng với Caddyfile và .env)
services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/umoja.db
    volumes:
      # database SQLite nằm ngoài container → deploy lại không mất dữ liệu
      - ./data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
