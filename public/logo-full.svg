<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 128" role="img" aria-label="Mầm Xanh Umoja">
  <title>Mầm Xanh Umoja</title>
  <!-- bản dùng trên nền tối — sinh tự động từ logo.svg -->
  <svg x="0" y="0" width="128" height="128" viewBox="0 0 128 128">
  
  <defs>
    <radialGradient id="mx-sun" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.6" stop-color="#f4a261"/>
      <stop offset="1" stop-color="#e76f51"/>
    </radialGradient>
    <linearGradient id="mx-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7f7c4"/>
      <stop offset="1" stop-color="#2d9d5a"/>
    </linearGradient>
    <clipPath id="mx-clip"><circle cx="64" cy="64" r="60"/></clipPath>
  </defs>

  <!-- nền: bầu trời đêm của làng -->
  <circle cx="64" cy="64" r="62" fill="#141b17"/>
  <g clip-path="url(#mx-clip)">
    <!-- mặt trời Umoja -->
    <circle cx="64" cy="60" r="34" fill="url(#mx-sun)"/>

    <!-- tòa nhà rác AI bị tách đôi, nghiêng ra hai phía -->
    <g transform="rotate(-11 34 100)">
      <path d="M30 100 V38 L50 30 L57 38 L52 50 L58 61 L52 73 L58 86 L54 100 Z" fill="#2f353a"/>
      <rect x="35" y="42" width="5" height="4" rx="1" fill="#f4a261" opacity=".85"/>
      <rect x="43" y="40" width="5" height="4" rx="1" fill="#f4a261" opacity=".35"/>
      <rect x="35" y="54" width="5" height="4" rx="1" fill="#f4a261" opacity=".35"/>
      <rect x="43" y="54" width="5" height="4" rx="1" fill="#f4a261" opacity=".85"/>
      <rect x="35" y="66" width="5" height="4" rx="1" fill="#f4a261" opacity=".85"/>
      <rect x="43" y="78" width="5" height="4" rx="1" fill="#f4a261" opacity=".35"/>
    </g>
    <g transform="rotate(11 94 100)">
      <path d="M98 100 V38 L78 30 L71 38 L76 50 L70 61 L76 73 L70 86 L74 100 Z" fill="#2f353a"/>
      <rect x="88" y="42" width="5" height="4" rx="1" fill="#f4a261" opacity=".35"/>
      <rect x="80" y="40" width="5" height="4" rx="1" fill="#f4a261" opacity=".85"/>
      <rect x="88" y="54" width="5" height="4" rx="1" fill="#f4a261" opacity=".85"/>
      <rect x="80" y="66" width="5" height="4" rx="1" fill="#f4a261" opacity=".35"/>
      <rect x="88" y="78" width="5" height="4" rx="1" fill="#f4a261" opacity=".85"/>
    </g>

    <!-- đất đỏ châu Phi, đã bắt đầu xanh ở giữa -->
    <path d="M0 98 Q64 86 128 98 V128 H0 Z" fill="#8b4a2b"/>
    <path d="M38 95 Q64 88 90 95 Q64 99 38 95 Z" fill="#2d9d5a"/>

    <!-- mầm xanh mọc qua vết nứt -->
    <path d="M64 96 C64 84 63 74 64 60" stroke="#2d9d5a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M64 70 C52 70 42 62 40 50 C53 50 62 57 64 70 Z" fill="url(#mx-leaf)"/>
    <path d="M64 62 C66 48 76 40 90 40 C88 54 78 62 64 62 Z" fill="url(#mx-leaf)"/>
  </g>
  <circle cx="64" cy="64" r="61" fill="none" stroke="#80ed99" stroke-opacity=".35" stroke-width="2"/>
</svg>
  <text x="146" y="72" font-family="'Playfair Display', 'Noto Serif', 'Times New Roman', serif" font-size="48" font-weight="900" fill="#f5ecd7">Mầm Xanh</text>
  <text x="150" y="106" font-family="'Be Vietnam Pro', 'Segoe UI', 'Noto Sans', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="12" fill="#80ed99">UMOJA</text>
</svg>
